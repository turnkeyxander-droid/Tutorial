<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - NEXT</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/productToggle.css">
    <script src="https://kit.fontawesome.com/1353181530.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="header-container"></div>

    <div class="cart__container">
        <h1 class="section__title">Your Cart</h1>

        <div class="cart__items" id="cartItems">
            <!-- 由 cart.js 动态生成 -->
        </div>

        <div class="cart__summary" id="cartSummary">
            <p class="cart__total">Total: <span id="cartTotal">RM0.00</span></p>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/page-transition.js"></script>
</body>
</html>
