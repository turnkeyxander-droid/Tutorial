<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NEXT</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/checkout.css">
    <link rel="stylesheet" href="/css/productToggle.css">
    <script src="https://kit.fontawesome.com/1353181530.js" crossorigin="anonymous"></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <div id="header-container"></div>

    <div class="checkout__container">
        <div class="checkout__wrapper">

            <!-- Left: Order Summary -->
            <div class="checkout__summary">
                <h2>Order Summary</h2>
                <div id="checkoutItems"></div>
                <div class="checkout__total">
                    <span>Total</span>
                    <span id="checkoutTotal">RM0.00</span>
                </div>
            </div>

            <!-- Right: Shipping + Payment -->
            <div class="checkout__form--section">
                <h2>Shipping Address</h2>
                <input type="text" id="shippingAddress" placeholder="Enter your full address" required>

                <h2>Payment</h2>
                <div id="payment-element"></div>

                <button id="payButton" class="checkout__pay-btn">Pay Now</button>
                <p id="checkoutMessage" class="checkout__message"></p>
            </div>

        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/page-transition.js"></script>
    <script src="/js/checkout.js"></script>
</body>
</html>
