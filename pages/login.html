<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT Website</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://kit.fontawesome.com/1353181530.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Hero Section -->
    <div class="login__container">

        <form class="login_detail" id="loginForm">
            <div class="login_header"><h1>Welcome</h1></div>
            <div class="login_form">
                <label>Email:</label>
                <input type="email" id="email" required>

                <label>Password:</label>
                <input type="password" id="password" required>
                
                <div class="btn_container">
                    <button class="submit-btn" type="submit">Login</button>
                </div>
                
                <p>Don't have account yet? <a href="/pages/signup.html">Register Now!</a></p> 
            </div>
        </form>

    </div>

    <script src="/js/login.js"></script>
</body>
</html>
