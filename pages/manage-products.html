<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - NEXT</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/productToggle.css">
    <script src="https://kit.fontawesome.com/1353181530.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="header-container"></div>

    <!-- Section B: Product Management -->
    <div class="products__manage">
        <div class="manage__header">
            <h2 class="section__title">Manage Products</h2>
            <button class="add__btn" id="addProductBtn">+ Add Product</button>
        </div>

        <div class="manage__table--container">
            <div class="manage__table--header">
                <div class="header__cell">ID</div>
                <div class="header__cell">Image</div>
                <div class="header__cell">Name</div>
                <div class="header__cell">Description</div>
                <div class="header__cell">Product ID</div>
                <div class="header__cell">Category</div>
                <div class="header__cell">Price</div>
                <div class="header__cell">Quantity</div>
                <div class="header__cell">Action</div>
            </div>

            <div class="manage__table--wrapper">
                <table class="manage__table">
                    <tbody id="productTableBody">
                        <!-- Product rows will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal__overlay" id="productOverlay">
        <div class="modal" id="productModal">
            <button class="modal__close" id="productClose" aria-label="Close">&times;</button>

            <h2 class="modal__title" id="productModalTitle">Add Product</h2>

            <form id="productForm" class="modal__form">
                <input type="hidden" id="productDbId">

                <div class="modal__field">
                    <label for="productName">Name</label>
                    <input type="text" id="productName" required>
                </div>

                <div class="modal__field">
                    <label for="detailDescription">Description</label>
                    <textarea id="detailDescription" rows="3" required></textarea>
                </div>

                <div class="modal__field">
                    <label for="productCode">Product ID</label>
                    <input type="text" id="productCode" required>
                </div>

                <div class="modal__field">
                    <label>Product Image</label>
                    <div class="image__upload">
                        <input type="file" id="productImage" accept="image/*" hidden>
                        <label for="productImage" class="image__upload--btn">
                            <i class="fa-solid fa-upload"></i> Choose Image
                        </label>
                        <img id="imagePreview" class="image__preview" style="display:none;">
                    </div>
                    
                </div>

                <div class="modal__field">
                    <label for="productCategory">Category</label>
                    <select id="productCategory" required>
                        <option value="">Select a category</option>
                        <!-- Category options will be populated by JavaScript -->
                    </select>
                </div>

                <div class="modal__field">
                    <label for="productPrice">Price (RM)</label>
                    <input type="number" id="productPrice" min="0" step="0.01" required>
                </div>

                <div class="modal__field">
                    <label for="productQuantity">Quantity</label>
                    <input type="number" id="productQuantity" min="1" required>
                </div>

                <button type="submit" class="modal__save-btn" id="productSubmitBtn">Add Product</button>
            </form>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/js/admin-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/manage-products.js"></script>
    <script src="/js/page-transition.js"></script>
</body>
</html>
