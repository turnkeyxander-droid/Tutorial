<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail - NEXT</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/orders.css">
    <link rel="stylesheet" href="/css/productToggle.css">
    <script src="https://kit.fontawesome.com/1353181530.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="header-container"></div>

    <div class="orders__container">
        <a href="/pages/orders.html" class="back__btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Orders
        </a>

        <h1 class="section__title" id="orderTitle">Order Detail</h1>

        <div class="order__tracker" id="orderTracker"></div>

        <div class="order__detail--card">
            <div class="order__detail--header">
                <span>Shipping Address</span>
                <span id="orderAddress"></span>
            </div>

            <div id="orderItemsList" class="order__items--list"></div>

            <div class="order__detail--total">
                <span>Total</span>
                <span id="orderTotal"></span>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/page-transition.js"></script>
    <script src="/js/orders-detail.js"></script>
</body>
</html>
