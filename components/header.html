<div class="modal__overlay" id="profileOverlay">
    <div class="modal" id="profileModal">
        <button class="modal__close" id="profileClose" aria-label="Close">&times;</button>

        <h2 class="modal__title">Your Profile</h2>

        <form id="profileForm" class="modal__form">
            <div class="modal__field">
                <label for="profileUsername">Name</label>
                <input type="text" id="profileUsername" required>
            </div>

            <div class="modal__field">
                <label for="profileEmail">Email</label>
                <input type="email" id="profileEmail" required>
            </div>

            <button type="submit" class="modal__save-btn">Save Changes</button>
        </form>

        <hr class="modal__divider">

        <details class="modal__password-toggle">
            <summary>Change Password</summary>
            <form id="passwordForm" class="modal__form">
                <div class="modal__field">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="modal__field">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="modal__field">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="modal__save-btn modal__save-btn--secondary">Update Password</button>
            </form>
        </details>
    </div>
</div>
